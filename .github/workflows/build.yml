name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check syntax and translations
        run: npm run check

      - name: Build Windows installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: Liser-Setup
          path: dist/*.exe
          if-no-files-found: error

      # Same installer under a fixed name, so that
      # releases/latest/download/Liser-Setup.exe always points to the newest one.
      - name: Copy installer to fixed name
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Copy-Item (Get-ChildItem dist/Liser-Setup-*.exe | Select-Object -First 1).FullName dist/Liser-Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
